name: Formation Bio
description: Formation Bio (formerly TrialSpark, founded 2016 in New York City) is a tech-driven, AI-native
  pharmaceutical company that aims to bring new treatments to patients faster and more efficiently. Rather
  than discovering drugs, Formation Bio in-licenses and acquires clinical-stage drug assets from pharma
  companies, universities, and biotech firms, then develops them using proprietary technology platforms,
  process automation, and large language models applied across the drug development lifecycle — patient
  recruitment, e-consent, data management, monitoring, and biostatistics. The company rebranded from TrialSpark
  to Formation Bio in 2023 as it moved from a pure clinical-trial software platform to combined platform-plus-asset
  ownership. It raised a $372M Series D in 2024 and announced a first-in-class AI collaboration with Sanofi
  and OpenAI. Formation Bio operates hybrid teams across New York City, Boston, the San Francisco Bay
  Area, and North Carolina's Research Triangle. It is a private company with no public developer API program;
  this profile captures its identity and public web surface for the API Evangelist network.
